        <div class="row"><label class="btn ghost icon" title="Lampiran" aria-label="Lampiran">${icon('clip')}<input type="file" hidden data-file-chat></label><button class="btn ghost icon" data-poll title="Polling" aria-label="Buat polling">${icon('poll')}</button><button class="btn ghost icon" data-taskn title="Tugas ringan" aria-label="Buat tugas">${icon('task')}</button><button class="btn ghost icon" data-mention title="Sebut anggota" aria-label="Sebut anggota">@</button>
        <textarea class="inp grow" id="ct" rows="1" placeholder="Tulis pesan… (Enter kirim, Shift+Enter baris baru)" style="min-height:40px;max-height:120px">${esc(draft)}</textarea><button class="btn gold icon" data-send aria-label="Kirim">${icon('send')}</button></div>
        ${data.moderator || S.user.roles.includes('ketua') ? `<label class="check tiny muted"><input type="checkbox" id="c-penting"> Tandai penting (kirim notifikasi ke semua anggota)</label>` : ''}</div>`;
    const ms = $('#msgs', el); if (atBottom) ms.scrollTop = ms.scrollHeight;
    rooms = await call('chat.rooms'); drawRooms();
  }
  async function send(extra) {
    const ta = $('#ct', el), teks = ta ? ta.value.trim() : '';
    if (!teks && !file && !extra) return;
    try { await call('chat.send', Object.assign({ room: cur, teks, reply_to: reply ? reply.id : '', file, fileName, penting: !!($('#c-penting', el) || {}).checked }, extra || {})); if (ta) ta.value = ''; reply = null; file = null; fileName = ''; openRoom(cur); }
    catch (e) { fail(e); }
  }
  on(el, 'click', '[data-room]', (e, r) => { reply = null; file = null; openRoom(r.dataset.room); });
  on(el, 'click', '[data-back]', () => chat.classList.remove('in-room'));
  on(el, 'click', '[data-send]', () => send());
  on(el, 'keydown', '#ct', e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); } });
  on(el, 'click', '[data-unreply]', () => { reply = null; openRoom(cur, true); });
  on(el, 'click', '[data-unfile]', () => { file = null; openRoom(cur, true); });
  on(el, 'change', '[data-file-chat]', async (e, inp) => { const f = inp.files[0]; if (!f) return; try { file = await readImage(f); fileName = f.name; openRoom(cur, true); } catch (x) { fail(x); } });
  on(el, 'click', '[data-act]', async (e, b) => {

    if (!cur || document.visibilityState !== 'visible' || $('.modal-bg')) return;

};

function DKM_ROLES_MATRIX() {
  const out = {}, roles = Object.keys(S.me.roles);
  Object.values(S.meta).filter(m => !m.hidden).forEach(m => {
    const row = { title: m.title }, src = m.r ? m : null;
    roles.forEach(r => { if (!src) return; const c = []; const inR = l => l.includes('*') || l.includes(r) || r === 'admin'; if (inR(src.r)) c.push('B'); if (inR(src.c)) c.push('T'); if (inR(src.w)) c.push('U'); if (!c.length && src.own && inR(src.c)) c.push('T'); row[r] = c.join(''); });
    out[m.key] = row;
  });
  return out;
}

/* DKM Nuur Hidayah — Studio Poster, tautan publik, pop-up beranda, kutipan, animasi angka */
const SHAREABLE = ['announcements', 'news', 'events', 'kajian', 'petugas', 'campaigns'];
function appBase() { const u = S.home && S.home.masjid && S.home.masjid.app_url; return (u || location.href).split('#')[0]; }
function shareLink(m, id) { return appBase() + '#lihat-' + m + '-' + id; }
function pageLink(r) { return appBase() + '#' + r; }
const reduceMotion = () => { try { return matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) { return false; } };
function fDateLong(s) { const d = pdate(s); return isNaN(d) ? s : `${HARI[d.getDay()]}, ${d.getDate()} ${BULAN_L[d.getMonth()]} ${d.getFullYear()}`; }
function fDTLong(s) { if (!s) return ''; const d = new Date(s); return isNaN(d) ? s : `${fDateLong(s)} · pukul ${pad(d.getHours())}.${pad(d.getMinutes())}`; }

/* ---------- angka berjalan pada kartu statistik ---------- */
function animateNumbers(root) {
  if (!root || reduceMotion()) return;
  $$('.stat .v', root).forEach(el => {
    let t = el; if (el.children.length) { if (el.children.length === 1 && !el.firstElementChild.children.length) t = el.firstElementChild; else return; }
    const m = t.textContent.match(/^([^\d]*)(\d{1,3}(?:\.\d{3})+|\d+)(,\d+)?(.*)$/); if (!m) return;
    const dec = m[3] ? m[3].length - 1 : 0, target = parseFloat(m[2].replace(/\./g, '') + (m[3] ? '.' + m[3].slice(1) : ''));
    if (!isFinite(target) || target === 0) return;
    const t0 = performance.now(), dur = 950, fmt = v => v.toLocaleString('id-ID', { minimumFractionDigits: dec, maximumFractionDigits: dec });
    const step = now => { const p = Math.min(1, (now - t0) / dur), e = 1 - Math.pow(1 - p, 3); t.textContent = m[1] + fmt(target * e) + m[4]; if (p < 1) requestAnimationFrame(step); };
    requestAnimationFrame(step);
  });
}

async function buildSpec(src) {
  const home = S.home || (S.home = await call('public.home')), t = todayS();

    const res = await call('crud.list', { m: 'petugas', where: { waktu: 'Jumat' }, from: t, limit: 50 }), rows = res.rows.reverse().slice(0, 6);
    if (!rows.length) { toast('Belum ada jadwal Jumat mendatang. Tambahkan di menu Jadwal Petugas Ibadah.', true); return null; }
    const pm = await call('public.prayerMonth', { month: rows[0].tanggal.slice(0, 7) }), dz = (pm.find(p => p.tanggal === rows[0].tanggal) || {}).waktu;
    return { kicker: 'Jadwal petugas shalat Jumat', title: 'Petugas Shalat Jumat', sub: `${fDate(rows[0].tanggal)} – ${fDate(rows[rows.length - 1].tanggal)}`,

      body: (dz ? `Waktu Dzuhur Jumat ini ± pukul ${dz.dzuhur.replace(':', '.')}. ` : '') + (rows[0].tema ? `Tema khutbah: ${rows[0].tema}. ` : '') + 'Jamaah dimohon hadir lebih awal.', link: pageLink('beranda') };
  }
  if (src.k === 'shalat') {
    const p = home.prayer[0], w = p.waktu;
    return { kicker: 'Jadwal shalat hari ini', title: fDateLong(p.tanggal), sub: hijri(pdate(p.tanggal)), rows: [['Imsak', w.imsak], ['Subuh', w.subuh], ['Terbit', w.terbit], [new Date(p.tanggal).getDay() === 5 ? 'Jumat' : 'Dzuhur', w.dzuhur], ['Ashar', w.ashar], ['Maghrib', w.maghrib], ['Isya', w.isya]].map(([k, v]) => [k, v.replace(':', '.')]), body: 'Waktu menurut metode Kemenag RI untuk lokasi masjid.', link: pageLink('jadwal-shalat') };

    let all = []; for (const mo of months) all = all.concat(await call('public.prayerMonth', { month: mo }));

    return { kicker: 'Jadwal shalat sepekan', title: 'Jadwal Shalat 7 Hari', sub: `${fDate(days[0].tanggal)} – ${fDate(days[days.length - 1].tanggal)}`,
      table: { head: ['Hari', 'Subuh', 'Dzuhur', 'Ashar', 'Maghrib', 'Isya'], widths: [.25, .15, .15, .15, .15, .15], highlight: true, rows: days.map(p => { const d = pdate(p.tanggal); return [HARI_S[d.getDay()] + ', ' + d.getDate() + ' ' + BULAN[d.getMonth()], p.waktu.subuh, p.waktu.dzuhur, p.waktu.ashar, p.waktu.maghrib, p.waktu.isya]; }) },
      body: 'Metode Kemenag RI · ihtiyat 2 menit.', link: pageLink('jadwal-shalat') };
  }
  if (src.k === 'kajianweek') {
    const res = await call('crud.list', { m: 'kajian', from: t, to: ymd(addD(new Date(), 7)), limit: 50 }), rows = res.rows.reverse();
    if (!rows.length) { toast('Belum ada kajian dalam 7 hari ke depan.', true); return null; }
    return { kicker: 'Majelis ilmu pekan ini', title: 'Jadwal Kajian', sub: `${fDate(t)} – ${fDate(ymd(addD(new Date(), 7)))}`,
      table: { head: ['Waktu', 'Kajian', 'Pemateri'], widths: [.25, .45, .30], highlight: true, rows: rows.map(k => { const d = new Date(k.jadwal); return [HARI_S[d.getDay()] + ' ' + pad(d.getHours()) + '.' + pad(d.getMinutes()), k.judul, k.pemateri]; }) },

  if (m === 'events') return { kicker: 'Undangan · ' + x.kategori, title: x.judul, rows: [['Waktu', fDTLong(x.mulai)], ['Tempat', x.lokasi || 'Masjid'], ['Peserta', +x.kuota ? 'Kuota ' + x.kuota + ' orang — daftar melalui tautan' : 'Terbuka untuk umum']], body: x.deskripsi, link };
  if (m === 'kajian') return { kicker: x.jenis, title: x.judul, rows: [['Pemateri', x.pemateri], ['Waktu', fDTLong(x.jadwal)], ['Tempat', x.tempat || 'Masjid']], body: x.ringkasan || 'Terbuka untuk umum. Ajak keluarga dan sahabat.', link };
  if (m === 'petugas') {
    const pm = await call('public.prayerMonth', { month: x.tanggal.slice(0, 7) }), pw = (pm.find(p => p.tanggal === x.tanggal) || {}).waktu, key = { Subuh: 'subuh', Dzuhur: 'dzuhur', Jumat: 'dzuhur', Ashar: 'ashar', Maghrib: 'maghrib', Isya: 'isya' }[x.waktu];

  }
  if (m === 'campaigns') { const b = (home.masjid.rekening || [])[0]; return { kicker: 'Amal jariyah · ' + x.kategori, title: x.judul, rows: [['Target', rp(x.target)], ['Terkumpul', rp(x._terkumpul) + ' (' + Math.round(x._terkumpul / x.target * 100) + '%)'], b ? ['Rekening', b.bank + ' ' + b.no + ' a.n. ' + b.an] : null].filter(Boolean), body: x.deskripsi, link }; }
  throw new Error('Jenis poster tidak dikenal.');

  on(el, 'click', '[data-tpl-c]', () => importTemplate(key, 'csv'));
  ['dragover', 'dragenter'].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.add('over'); }));
  ['dragleave', 'drop'].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.remove('over'); }));
  drop.addEventListener('drop', e => { const f = e.dataTransfer.files[0]; if (f) handle(f); });
  $('#imp-file', el).onchange = e => { const f = e.target.files[0]; if (f) handle(f); e.target.value = ''; };
  const step = n => $$('.imp-steps span', el).forEach((s, i) => s.classList.toggle('on', i < n));
  async function handle(file) {
    fileName = file.name; res.innerHTML = '<div class="empty small">Membaca berkas…</div>'; go.disabled = true;
    try {
      const table = (await readTableFile(file)).filter(r => r.some(c => String(c).trim() !== ''));
      if (table.length < 2) throw new Error('Berkas kosong atau hanya berisi judul kolom.');
      let hi = table.findIndex(r => mapHeader(fields, r).filter(Boolean).length >= 2); if (hi < 0) throw new Error('Judul kolom tidak dikenali. Gunakan templat agar nama kolom sesuai.');
      const map = mapHeader(fields, table[hi]), unknown = table[hi].filter((h, i) => String(h).trim() && !map[i]);
      rows = table.slice(hi + 1).map((r, ri) => { const o = { __line: hi + ri + 2 }; map.forEach((f, i) => { if (f) o[f.k] = normCell(f, r[i]); }); return o; });
      const missing = fields.filter(f => f.req && !map.some(x => x && x.k === f.k));
      summary = await call('crud.import', { m: key, rows: rows.map(r => { const c = Object.assign({}, r); Object.keys(c).forEach(k => { if (typeof c[k] === 'string' && c[k].startsWith('__tidak_ditemukan__')) c[k] = c[k].slice(19); }); return c; }), dryRun: true });
      step(2);
      const errMap = {}; summary.rows.forEach(x => errMap[x.line] = x);
      const cols = fields.filter(f => map.some(x => x && x.k === f.k)).slice(0, 6);
      res.innerHTML = `<div class="imp-sum"><div class="stat"><span class="k">Baris dibaca</span><span class="v">${summary.total}</span></div><div class="stat"><span class="k" style="color:var(--good)">Jadwal baru</span><span class="v">${summary.tambah}</span></div><div class="stat"><span class="k" style="color:var(--info)">Diperbarui</span><span class="v">${summary.ubah}</span></div><div class="stat"><span class="k" style="color:var(--bad)">Perlu diperbaiki</span><span class="v">${summary.errors.length}</span></div></div>
        ${missing.length ? `<div class="imp-warn">${icon('alert')} Kolom wajib tidak ditemukan: <b>${missing.map(f => esc(f.label)).join(', ')}</b></div>` : ''}
        ${unknown.length ? `<div class="small muted">Kolom diabaikan: ${unknown.map(esc).join(', ')}</div>` : ''}
        <div class="tbl-wrap" style="max-height:340px;overflow:auto;margin-top:10px"><table class="tbl"><thead><tr><th>Baris</th><th>Status</th>${cols.map(f => `<th>${esc(f.label)}</th>`).join('')}</tr></thead><tbody>
        ${rows.slice(0, 300).map(r => { const x = errMap[r.__line] || {}; return `<tr style="cursor:default"><td class="num small">${r.__line}</td><td>${x.ok ? `<span class="badge ${x.act === 'ubah' ? 'info' : 'good'}">${x.act === 'ubah' ? 'Perbarui' : 'Baru'}</span>` : `<span class="badge bad" title="${esc(x.error)}">Perbaiki</span><div class="tiny" style="color:var(--bad);max-width:240px;white-space:normal">${esc(x.error || '')}</div>`}</td>${cols.map(f => { let v = r[f.k]; if (typeof v === 'string' && v.startsWith('__tidak_ditemukan__')) return `<td class="small" style="color:var(--bad)">${esc(v.slice(19))} (tidak terdaftar)</td>`; return `<td class="small">${f.type === 'user' || f.type === 'ref' ? esc(refLabel(f.type === 'user' ? 'users' : f.ref, v)) : f.type === 'bool' ? (v ? 'Ya' : 'Tidak') : esc(Array.isArray(v) ? v.join(', ') : String(v).replace('T', ' '))}</td>`; }).join('')}</tr>`; }).join('')}
        </tbody></table></div>${rows.length > 300 ? `<div class="tiny muted">Menampilkan 300 baris pertama dari ${rows.length}.</div>` : ''}`;
      const okN = summary.tambah + summary.ubah;
      go.disabled = !okN; go.innerHTML = icon('check') + (summary.errors.length ? ` Simpan ${okN} baris valid, lewati ${summary.errors.length}` : ` Simpan ${okN} jadwal`);
      animateNumbers(res);
    } catch (e) { res.innerHTML = `<div class="imp-warn">${icon('alert')} ${esc(e.message)}</div>`; step(1); }
  }
  go.onclick = async () => {
    if (!summary) return; busy(go, true);
    try {
      const clean = rows.map(r => { const c = Object.assign({}, r); Object.keys(c).forEach(k => { if (typeof c[k] === 'string' && c[k].startsWith('__tidak_ditemukan__')) c[k] = c[k].slice(19); }); return c; });
      const out = await call('crud.import', { m: key, rows: clean, skipInvalid: true, fileName });
      step(3); md.close(); toast(`Impor selesai: ${out.tambah} jadwal baru, ${out.ubah} diperbarui${out.errors.length ? ', ' + out.errors.length + ' dilewati' : ''}.`); done && done();
    } catch (e) { fail(e); busy(go, false); }
  };
}

async function demoAdminCard(box) {
  const wrap = document.createElement('div'); wrap.className = 'card demo-admin'; wrap.style.marginTop = '14px'; box.appendChild(wrap);
  wrap.innerHTML = '<div class="empty small">Memuat pengaturan demo…</div>';
  let s, home; try { [s, home] = await Promise.all([call('settings.get'), call('public.home')]); } catch (e) { wrap.innerHTML = `<div class="empty small">${esc(e.message)}</div>`; return; }
  const auto = (home.demo && !s.demo_url ? home.demo.url : '') || '';
  wrap.innerHTML = `<div class="card-h"><h3>${icon('flask')} Tombol Demo / Ujicoba</h3><span class="badge ${s.demo_enabled !== false ? 'good' : 'neutral'}" data-dstate>${s.demo_enabled !== false ? 'Tampil' : 'Disembunyikan'}</span></div>
    <div class="grid g2"><div class="stack sm">
      <label class="switch"><input type="checkbox" id="dm-on" ${s.demo_enabled !== false ? 'checked' : ''}><span></span> Tampilkan banner <b>Demo / Ujicoba</b> di bagian paling atas untuk pengurus dan jamaah</label>
      <div class="fld"><label for="dm-text">Teks banner</label><input class="inp" id="dm-text" maxlength="160" value="${esc(s.demo_text || '')}"></div>
      <div class="fld"><label for="dm-url">Alamat versi demo (opsional)</label><input class="inp" id="dm-url" value="${esc(s.demo_url || '')}" placeholder="${esc(auto || 'https://…')}"><span class="tiny muted">Kosongkan untuk memakai demo bawaan Web App: <span class="num">${esc(auto || '…/exec?mode=demo')}</span></span></div>
    </div><div class="stack sm"><div class="eyebrow">Pratinjau banner</div><div class="trial-bar trial-preview"><div class="in"><span class="trial-ic">${icon('flask')}</span><span class="trial-txt"><b>Ingin mencoba dulu?</b> <span data-dm-prev>${esc(s.demo_text || '')}</span></span><span class="btn trial">${icon('flask')} Demo / Ujicoba</span></div></div>
      <div class="small muted">Versi demo berisi data contoh dan berjalan di browser masing-masing pengunjung. Pengurus dan jamaah bisa mencoba semua peran tanpa mengubah data asli masjid. Saat dinonaktifkan, banner hilang dan alamat demo menampilkan pesan bahwa demo sedang ditutup.</div></div></div>
    <hr class="gold-rule"><div class="row"><button class="btn gold" data-dm-save>${icon('check')} Simpan</button>${(s.demo_url || auto) ? `<a class="btn" href="${esc(s.demo_url || auto)}" target="_blank" rel="noopener">${icon('share')} Buka versi demo</a>` : ''}</div>`;
  $('#dm-text', wrap).oninput = e => { $('[data-dm-prev]', wrap).textContent = e.target.value; };
  on(wrap, 'click', '[data-dm-save]', async (e, b) => {
    busy(b, true);
    try {
      const on1 = $('#dm-on', wrap).checked;
      await call('settings.save', { demo_enabled: on1, demo_text: $('#dm-text', wrap).value, demo_url: $('#dm-url', wrap).value });
      S.home = await call('public.home'); try { sessionStorage.removeItem('dkm-trial-hide'); } catch (x) { }
      const st = $('[data-dstate]', wrap); st.textContent = on1 ? 'Tampil' : 'Disembunyikan'; st.className = 'badge ' + (on1 ? 'good' : 'neutral');
      const slot = $('#ribbon-slot'); if (slot) slot.innerHTML = ribbonHtml();
      toast(on1 ? 'Banner Demo/Ujicoba ditampilkan' : 'Banner Demo/Ujicoba disembunyikan');
    } catch (x) { fail(x); } finally { busy(b, false); }
  });
}

boot();

})();
